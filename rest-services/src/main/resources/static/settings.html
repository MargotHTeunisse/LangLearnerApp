<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="css/stylesheet.css">
    <script src="js/language-utilities.js" async></script>
</head>
<body>
<a style="font-size:30px" href="index.html" id = "backButton">❮</a>
<div class="center">
    <h2>Choose a deck:</h2>
    <select id="selectedSourceLanguage">
        <option value="" selected disabled hidden>Source</option>
    </select>
    →
    <select id="selectedTargetLanguage">
        <option value="" selected disabled hidden>Target</option>
    </select>
    <br>
    <br>
    <input id = "languageButton" type="button" value = "Apply">
</div>
<script>
    if (sessionStorage.getItem("sourceLanguage") === null ||
        sessionStorage.getItem("targetLanguage") === null) {
        document.getElementById("backButton").style.display = 'none';
    }

    onload = () => {loadSettings()};
</script>
</body>
</html>
