<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LangLearner</title>
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="css/stylesheet.css">
    <script src="js/draw-next.js" async></script>
    <script src="js/change-button-to-draw.js"></script>
    <script src="js/show-answer.js" async></script>
    <script src="js/submit-answer.js" async></script>
    <script src="js/load.js" async></script>
    <script src="js/flip-direction.js" async></script>
</head>
<body>
<div>
    <div style="font-size:24px;">Translate<br><b id="source">##</b> → <b id="target">##</b></div>
    <input id = "flipButton" type="button" value = "Flip deck" onclick=flipDirection()>
<div id="word" class="card">#####</div>
<form id="translation" autocomplete="off">
</form>
<div id="feedback"><br></div>
    <div style="position:relative;text-align:right">
        <input id = "button" type = "button" onclick=showAnswer() value = "Show answer">
    </div>
</div>

<script>
    onload = () => {load();}
</script>
</body>
</html>
